<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#14112b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ian's Travels" />
  <title>Ian's Travels</title>
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #14112b; --bg2: #1f1a44; --card: #221d4a; --ink: #fbf6ff; --muted: #b6addb;
      --gold: #f3c969; --pink: #ff4f9a; --line: rgba(255,255,255,.1);
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) { --bg: #fbf5ec; --bg2: #f3e7d6; --card: #ffffff; --ink: #231c33; --muted: #75697f; --line: rgba(40,20,50,.1); }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      font: 16px/1.5 "Nunito", system-ui, sans-serif;
      background-image: radial-gradient(90% 50% at 50% 0%, var(--bg2), transparent 70%);
      background-repeat: no-repeat;
    }
    main { max-width: 720px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px 48px; }

    /* passport cover */
    .cover {
      position: relative; overflow: hidden; border-radius: 26px; padding: 26px 22px 22px;
      background: linear-gradient(160deg, #1d2a6b 0%, #14112b 100%); color: #fff;
      box-shadow: 0 18px 40px rgba(0,0,0,.35); isolation: isolate;
    }
    .cover::after {
      content: ""; position: absolute; inset: 10px; border: 1.5px dashed rgba(243,201,105,.35); border-radius: 18px; pointer-events: none;
    }
    .cover .label { font: 800 11px/1 "Nunito", system-ui, sans-serif, system-ui, sans-serif; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; }
    .cover h1 { margin: 10px 0 4px; font: 700 clamp(34px, 10vw, 48px)/1 "Fredoka", sans-serif; color: var(--gold); letter-spacing: -.5px; }
    .cover p { margin: 6px 0 0; color: #d9d2f5; max-width: 30em; }
    .globe { position: absolute; right: -24px; top: -18px; font-size: 130px; opacity: .16; z-index: -1; animation: spin 40s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .plane { position: absolute; z-index: -1; font-size: 26px; animation: fly 9s ease-in-out infinite; }
    @keyframes fly { 0% { left: -10%; top: 70%; } 100% { left: 110%; top: 18%; } }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
    .stat { background: rgba(255,255,255,.08); border-radius: 16px; padding: 10px 12px; }
    .stat b { display: block; font: 700 24px/1.1 "Fredoka", system-ui, sans-serif, system-ui, sans-serif; color: #fff; }
    .stat span { font: 800 11px/1.2 "Nunito", system-ui, sans-serif, system-ui, sans-serif; color: #cfc6f0; text-transform: uppercase; letter-spacing: .6px; }

    h2 { margin: 30px 2px 12px; font: 700 22px/1.1 "Fredoka", sans-serif; }

    /* trip ticket */
    .trip {
      display: block; position: relative; overflow: hidden; text-decoration: none; color: #fff;
      border-radius: 24px; box-shadow: 0 14px 34px rgba(0,0,0,.28); isolation: isolate;
      transition: transform .15s ease;
    }
    .trip:active { transform: scale(.985); }
    .trip + .trip { margin-top: 14px; }
    .trip .top { padding: 20px 20px 16px; }
    .trip .flag { font-size: 44px; line-height: 1; }
    .trip h3 { margin: 10px 0 0; font: 700 32px/1 "Fredoka", system-ui, sans-serif, system-ui, sans-serif; }
    .trip h3 small { font: 700 20px "Zen Maru Gothic", sans-serif; opacity: .85; margin-left: 6px; }
    .trip .sub { margin-top: 4px; font-weight: 800; opacity: .92; }
    .trip .cities { margin-top: 10px; font-size: 14.5px; opacity: .95; }
    .trip .vibes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .trip .vibes span { padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.18); font: 800 12.5px/1.2 "Nunito", system-ui, sans-serif, system-ui, sans-serif; backdrop-filter: blur(4px); }
    .trip .stub {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 13px 20px; background: rgba(0,0,0,.28); border-top: 2px dashed rgba(255,255,255,.3);
      font: 800 14px/1.2 "Nunito", system-ui, sans-serif, system-ui, sans-serif;
    }
    .trip .go { padding: 8px 14px; border-radius: 999px; background: #fff; color: #2a1236; }
    .trip .deco { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
    .trip .deco span { position: absolute; font-size: 34px; opacity: .35; animation: bob 6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-8px) rotate(6deg); } }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font: 800 11px/1.2 "Nunito", system-ui, sans-serif, system-ui, sans-serif; text-transform: uppercase; letter-spacing: .6px; float: right; }
    .badge.now { background: #7cf2c4; color: #0b3326; animation: glow 1.8s ease-in-out infinite; }
    .badge.soon { background: var(--gold); color: #3a2800; }
    .badge.done { background: rgba(255,255,255,.85); color: #2a1236; }
    @keyframes glow { 50% { box-shadow: 0 0 0 6px rgba(124,242,196,.25); } }

    .next {
      display: grid; place-items: center; gap: 4px; margin-top: 14px; padding: 26px 16px;
      border: 2px dashed var(--line); border-radius: 24px; color: var(--muted); text-align: center; font-weight: 800;
    }
    .next .e { font-size: 30px; }
    .foot { margin-top: 30px; text-align: center; color: var(--muted); font-size: 12.5px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
  <main>
    <section class="cover">
      <span class="globe" aria-hidden="true">🌏</span>
      <span class="plane" aria-hidden="true">✈️</span>
      <div class="label">Passport · Pasaporte · パスポート</div>
      <h1>Ian's Travels</h1>
      <p>Every trip gets its own pocket guide: step-by-step days, photo spots, snacks, and the words you'll need. Tap a stamp to open it.</p>
      <div class="stats" id="stats"></div>
    </section>

    <h2>Stamps</h2>
    <div id="trips"></div>

    <div class="next"><span class="e">🧳</span>Next stamp loading…<span style="font-weight:600;font-size:13px">Where to after Japan?</span></div>

    <p class="foot">Made with love for Ian · Add to Home Screen for one-tap access</p>
  </main>

  <script src="trips.js?v=1"></script>
  <script>
    (() => {
      const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const fmt = (iso, yr) => { const [y, m, d] = iso.split("-").map(Number); return `${months[m - 1]} ${d}${yr ? ", " + y : ""}`; };
      const day = iso => Date.UTC(...iso.split("-").map((n, i) => i === 1 ? n - 1 : +n));
      const todayUTC = (() => { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); })();

      const trips = [...TRIPS].sort((a, b) => b.start.localeCompare(a.start));
      const days = TRIPS.reduce((t, x) => t + Math.round((day(x.end) - day(x.start)) / 864e5) + 1, 0);
      const countries = new Set(TRIPS.map(t => t.country)).size;
      document.getElementById("stats").innerHTML =
        `<div class="stat"><b>${countries}</b><span>Countr${countries === 1 ? "y" : "ies"}</span></div>
         <div class="stat"><b>${TRIPS.length}</b><span>Trip${TRIPS.length === 1 ? "" : "s"}</span></div>
         <div class="stat"><b>${days}</b><span>Days away</span></div>`;

      const pos = [[78, 8], [88, 42], [70, 70], [58, 6]];
      document.getElementById("trips").innerHTML = trips.map(t => {
        const s = day(t.start), e = day(t.end);
        let badge;
        if (todayUTC >= s && todayUTC <= e) badge = `<span class="badge now">● Happening now</span>`;
        else if (todayUTC < s) {
          const n = Math.round((s - todayUTC) / 864e5);
          badge = `<span class="badge soon">${n === 1 ? "Tomorrow!" : `In ${n} days`}</span>`;
        } else badge = `<span class="badge done">Visited ✓</span>`;
        const deco = (t.emoji || []).map((x, i) => `<span style="left:${pos[i % 4][0]}%;top:${pos[i % 4][1]}%;animation-delay:${-i * 1.3}s">${x}</span>`).join("");
        return `<a class="trip" href="${esc(t.slug)}" style="background:${t.cover}">
          <div class="deco" aria-hidden="true">${deco}</div>
          <div class="top">
            ${badge}
            <div class="flag">${t.flag}</div>
            <h3>${esc(t.country)}<small>${esc(t.local || "")}</small></h3>
            <div class="sub">${esc(t.title)} · ${fmt(t.start, t.start.slice(0,4) !== t.end.slice(0,4))} – ${fmt(t.end, true)}</div>
            <div class="cities">📍 ${t.cities.map(esc).join(" · ")}</div>
            <div class="vibes">${(t.vibes || []).map(v => `<span>${esc(v)}</span>`).join("")}</div>
          </div>
          <div class="stub"><span>${Math.round((e - s) / 864e5) + 1} days · ${t.cities.length} stops</span><span class="go">Open guide →</span></div>
        </a>`;
      }).join("");
    })();
  </script>
</body>
</html>
